{% extends "base.html" %}

{% block title %}Kitob qo'shish{% endblock %}

{% block content %}

<style>
    .create-container {
        min-height: 75vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 35px 15px;
    }

    .create-card {
        width: 100%;
        max-width: 650px;
        padding: 35px;
        background: rgba(30, 41, 59, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 22px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        color: #f8fafc;
    }

    .create-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .create-icon {
        font-size: 48px;
        margin-bottom: 12px;
    }

    .create-header h1 {
        font-size: 28px;
        margin: 0;
        color: #fff;
    }

    .create-header p {
        color: #94a3b8;
        margin-top: 10px;
    }

    .create-card form p {
        margin-bottom: 20px;
    }

    .create-card label {
        display: block;
        margin-bottom: 9px;
        color: #cbd5e1;
        font-weight: 600;
    }

    .create-card input,
    .create-card textarea,
    .create-card select {
        width: 100%;
        box-sizing: border-box;
        padding: 13px 15px;
        border-radius: 11px;
        border: 1px solid #475569;
        background: #0f172a;
        color: white;
        font-size: 15px;
        outline: none;
        transition: 0.3s;
    }

    .create-card input:focus,
    .create-card textarea:focus,
    .create-card select:focus {
        border-color: #38bdf8;
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .create-card textarea {
        min-height: 120px;
        resize: vertical;
    }

    .create-card .helptext {
        display: block;
        margin-top: 6px;
        color: #94a3b8;
        font-size: 12px;
    }

    .create-card ul.errorlist {
        color: #f87171;
        padding-left: 20px;
        font-size: 13px;
    }

    .create-button {
        width: 100%;
        padding: 14px;
        margin-top: 10px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #06b6d4, #6366f1);
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    .create-button:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 25px rgba(6, 182, 212, 0.25);
    }

    .back-link {
        display: block;
        text-align: center;
        margin-top: 22px;
        color: #38bdf8;
        text-decoration: none;
    }

    .back-link:hover {
        color: #a5f3fc;
    }

    @media (max-width: 600px) {
        .create-card {
            padding: 24px 18px;
        }

        .create-header h1 {
            font-size: 23px;
        }
    }
</style>

<div class="create-container">
    <div class="create-card">

        <div class="create-header">
            <div class="create-icon">📚</div>
            <h1>Yangi kitob qo'shish</h1>
            <p>Kitob ma'lumotlarini to'ldiring</p>
        </div>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="create-button">
                ＋ Kitobni qo'shish
            </button>
        </form>

        <a href="{% url 'books' %}" class="back-link">
            ← Kitoblar ro'yxatiga qaytish
        </a>

    </div>
</div>

{% endblock %}
