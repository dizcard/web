{% extends "base.html" %}

{% block title %}Create UserBook{% endblock %}

{% block content %}

<style>
    .create-container {
        min-height: 75vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px 15px;
    }

    .create-card {
        width: 100%;
        max-width: 550px;
        padding: 35px;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 20px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        color: white;
    }

    .create-card h1 {
        text-align: center;
        margin-bottom: 10px;
        font-size: 28px;
    }

    .subtitle {
        text-align: center;
        color: #94a3b8;
        margin-bottom: 30px;
    }

    .create-card label {
        display: block;
        margin-bottom: 8px;
        color: #cbd5e1;
        font-weight: 600;
    }

    .create-card input,
    .create-card select,
    .create-card textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 13px;
        margin-bottom: 15px;
        border: 1px solid #475569;
        border-radius: 10px;
        background: #0f172a;
        color: white;
        outline: none;
    }

    .create-card input:focus,
    .create-card select:focus,
    .create-card textarea:focus {
        border-color: #38bdf8;
    }

    .create-button {
        width: 100%;
        padding: 14px;
        margin-top: 10px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #06b6d4, #6366f1);
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    .create-button:hover {
        transform: translateY(-3px);
    }

    .back-button {
        display: block;
        text-align: center;
        margin-top: 20px;
        padding: 12px;
        border: 1px solid #475569;
        border-radius: 10px;
        color: #38bdf8;
        text-decoration: none;
        transition: 0.3s;
    }

    .back-button:hover {
        background: #334155;
        color: white;
    }

    .create-card .errorlist {
        color: #f87171;
    }

    @media (max-width: 600px) {
        .create-card {
            padding: 22px;
        }
    }
</style>

<div class="create-container">
    <div class="create-card">

        <h1>📚 Create UserBook</h1>
        <p class="subtitle">O'quvchiga kitob biriktiring</p>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="create-button">
                ＋ Yaratish
            </button>
        </form>

        <a href="{% url 'userbooks' %}" class="back-button">
            ← Orqaga qaytish
        </a>

    </div>
</div>

{% endblock %}
